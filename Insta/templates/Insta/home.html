{% extends 'Insta/main.html' %}

{% block content %}

<h1> Welcome to the HOMEPAGE</h1>

 <div>
    <a href="{% url 'create-room' %}">Create Room</a>

    <div>
        {% for room in rooms %}
        <div>
            <spam>@{{room.host.username}}</spam>
          
            <h3>{{room.id}} --<a href="{% url 'room' room.id %}"> {{room.name}}</a></h3>
            <small>{{room.topic.name}}</small>
        </div>
        {% endfor %}
    </div>
 </div>


{% endblock %}
